<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>バズログ</title>
  <meta name="description" content="YouTube・X・Bluesky・ニコニコ・はてブなど、いろんなサービスで話題の投稿と動画をひとつにまとめたサイト">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="logo" href="./">バズ<span>ログ</span></a>
      <p class="tagline">いま話題の投稿と動画を、サービスをまたいでひとまとめ。</p>
      <p class="updated" id="updated">読み込み中…</p>
    </div>
    <nav class="wrap filters" aria-label="サービスで絞り込み">
      <div class="chips" id="chips"></div>
      <label class="sort">並び順
        <select id="sort">
          <option value="mix">ミックス</option>
          <option value="new">新しい順</option>
          <option value="score">反応が多い順</option>
        </select>
      </label>
    </nav>
  </header>

  <section class="wrap trends" id="trends" hidden aria-label="Google 急上昇ワード">
    <h2 class="trends-h">急上昇ワード</h2>
    <ol class="trends-list" id="trends-list"></ol>
  </section>

  <main class="wrap">
    <div id="grid" class="grid" aria-live="polite"></div>
    <p id="empty" class="empty" hidden>このサービスの投稿はまだありません。</p>
  </main>

  <footer class="wrap foot">
    <p>各投稿の著作権は投稿者に帰属します。表示は各サービス公式の埋め込みと公開データを使っています。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
